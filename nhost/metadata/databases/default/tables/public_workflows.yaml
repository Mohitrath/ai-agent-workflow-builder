table:
  schema: public
  name: workflows
object_relationships:
  - name: organization
    using: {foreign_key_constraint_on: org_id}
array_relationships:
  - name: steps
    using: {foreign_key_constraint_on: {column: workflow_id, table: {schema: public, name: workflow_steps}}}
  - name: triggers
    using: {foreign_key_constraint_on: {column: workflow_id, table: {schema: public, name: workflow_triggers}}}
  - name: runs
    using: {foreign_key_constraint_on: {column: workflow_id, table: {schema: public, name: workflow_runs}}}
computed_fields:
  - name: avg_run_duration_seconds
    definition:
      function: {schema: public, name: workflow_avg_run_duration_seconds}
select_permissions:
  - role: user
    permission:
      columns: [id, org_id, name, description, created_by, is_active, created_at, updated_at]
      computed_fields: [avg_run_duration_seconds]
      filter:
        organization:
          org_members:
            user_id: {_eq: X-Hasura-User-Id}
insert_permissions:
  - role: user
    permission:
      columns: [name, description, org_id, is_active]
      set: {created_by: X-Hasura-User-Id}
      check:
        organization:
          org_members:
            user_id: {_eq: X-Hasura-User-Id}
            role: {_in: [owner, editor]}
update_permissions:
  - role: user
    permission:
      columns: [name, description, is_active]
      filter:
        organization:
          org_members:
            user_id: {_eq: X-Hasura-User-Id}
            role: {_in: [owner, editor]}
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          org_members:
            user_id: {_eq: X-Hasura-User-Id}
            role: {_eq: owner}
